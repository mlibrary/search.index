name: catalog
transformer: MLibrarySearchParser::Transformer::Solr::LocalParams
search_field_default: all_fields
search_attr_defaults:
  mm: $default_mm
  mm.autoRelax: $mm.autoRelax
  tie: $tie
search_fields:
  title:
    qf: title_common_exact^1000 title_common^120 title_equiv^60 title_rest^30 series^10 series2^5
    pf: serialTitle_common_exact^600 title_common_exact^500 title_l^150 title_common^100 title_a_exact^50 title_top^30 title_rest^20 series^3 series2^2
  author:
    qf: mainauthor^20 author_authoritative_search^15 author^10 author2^5 author_top^2 author_rest^1
    pf: mainauthor^100 author^50 author2^20 author_top^5 author_rest^2
  all_fields: &ALL_FIELDS
    qf: >-
      allfieldsProper^2 allfields^1 title_common^50 title_equiv^10 mainauthor^80 author^50 isbn issn oclc lccn barcode htid callnosearch bookplate
    pf: >-
      title_equiv^40 title_top^20 title_rest^10

      author^80 author_top^30 author_rest^20
    pf2: >-
      title_author^500 title_equiv^80 title_l^50
    ps2: 2
    boost: >-
      product(


        if(termfreq('format', 'Journal'), 1.4, 1),
        max(
          map(
          query({!field f=title_common_exact v=$q}, 1), 0, 1, 1, 180
        ),
        map(
          query({!field f=title_equiv_exact v=$q}, 1), 0, 1, 1, 50
        ),
        map(
          query({!field f=title_a_exact v=$q}, 1), 0, 1, 1, 10
        )),
        map(
            query({!dismax f=title_author v=$q mm="100%"}, 1), 0, 1, 1, 50
          ),
      )
  keyword: *ALL_FIELDS
  series:
    pf: series^500 series2^50
    qf: series^200 series2^50
  serial_title:
    pf: serialTitle_common_exact^600 serialTitle_common_l^300 serialTitle_common^100 serialTitle_a_exact^40  serialTitle_equiv^20
    qf: serialTitle_common^30 serialTitle_equiv^15 serialTitle_rest^10
  journal_title:
    pf: serialTitle_common_exact^600 serialTitle_common_l^300 serialTitle_common^100 serialTitle_a_exact^40  serialTitle_equiv^20
    qf: serialTitle_common^30 serialTitle_equiv^15 serialTitle_rest^10
    #  journal_title:
    #    pf: serialTitle_ab^25000 serialTitle_a^15000 serialTitleProper^1200
    #    qf: serialTitleProper^120  serialTitle^30 serialTitle_rest^10
  subject:
    pf: topicProper^5 topic^1 fullgeographic^1 fullgenre^1 era^1
    qf: topicProper^5 topic^1 fullgeographic^1 fullgenre^1 era^1
  subject2:
    pf: topicProper^5 topic^1
    qf: topicProper^5 topic^1
  academic_discipline:
    pf: hlb3^10
    qf: hlb3^1
  realauth:
    pf: authorStr^10
    qf: authorStr^1
  isn:
    pf: issn^10 isbn^10 lccn^5 oclc^5 sdrnum^2 isn_related^2 rptnum ctrlnum ht_id  id id_int barcode
    qf: issn^10 isbn^10 lccn^5 oclc^5 sdrnum^2 isn_related^2 rptnum ctrlnum ht_id  id id_int barcode
  publisher:
    pf: publisher^10
    qf: publisher
  publication_date:
    pf: publishDate
    qf: publishDate
  # NOTE that title_starts_with is hard-coded to always be sent as a phrase (by manually
  # adding double-quotes around it) in catalog_controller. This is ancient spectrum code
  # not written by us. The title_l field by itself will *not* work as expected when in the 
  # qf, so q=one two qf=title_l in the solr admin console will find everything where "one"
  # is the first word and "two" is the second. 
  #
  # This should be fixed with a change to the query parser with some sort of a 
  # "force phrase" configuration, but how to do that well in the presence of 
  # field-typed booleans, e.g., title_l:(huck finn OR tom sawyer), will need some
  # work.
  title_starts_with:
    pf: serialTitle_common_l^10 title_l^5
    qf: title_l
  call_number_starts_with:
    pf: callnosearch sudoc
    qf: callnosearch sudoc
  lc_subject_starts_with:
    pf: subject_browse_leftanchored
    qf: subject_browse_leftanchored
# Note that solr_params will _not_ work if they reference '$q' or whatnot, since
# these are common to the whole search and those are specific to one edismax
# clause. (Noted because I tried to reference the allfields boost, which didn't work).
solr_params:
  default_mm: "2<-1 5<67%"
  mm.autoRelax: true
  tie: 0.1
  facet.threads: 10
facets:
  - authorStr
  - availability
  - building
  - collection
  - format
  - geographicStr
  - hlb3Str
  - institution
  - language
  - place_of_publication
  - publishDateRange
  - search_only
  - topicStr
qt: standard
academic_discipline_field: "hlb3Str"
